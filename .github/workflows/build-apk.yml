name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean conflicting Gradle files & ensure Android platform
        run: |
          set -e
          # Remove any leftover Groovy DSL that conflicts with .kts
          rm -f android/build.gradle android/settings.gradle android/app/build.gradle || true
          # Ensure gradle wrapper + icons exist
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            flutter create --platforms=android --project-name govtsahayak --org com.govtsahayak .
            # Re-apply our clean Kotlin DSL (flutter create may write Groovy on some versions)
            rm -f android/build.gradle android/settings.gradle android/app/build.gradle || true
          fi
          # Force correct AGP/Kotlin after any create (Flutter min AGP is 8.11.1 on 3.47+)
          cat > android/settings.gradle.kts << 'EOF'
pluginManagement {
    val flutterSdkPath =
        run {
            val properties = java.util.Properties()
            file("local.properties").inputStream().use { properties.load(it) }
            val flutterSdkPath = properties.getProperty("flutter.sdk")
            require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
            flutterSdkPath
        }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
    id("com.android.application") version "8.11.1" apply false
    id("org.jetbrains.kotlin.android") version "2.1.0" apply false
}

include(":app")
EOF
          # Ensure app/build.gradle.kts keeps our namespace + minSdk
          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'namespace = "com.govtsahayak.app"' android/app/build.gradle.kts || true
          fi

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK release
        run: |
          flutter build apk --release \
            --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: govtsahayak-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
