name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean conflicting Gradle files & ensure Android platform
        run: |
          set -e
          # Remove any leftover Groovy DSL that conflicts with .kts
          rm -f android/build.gradle android/settings.gradle android/app/build.gradle || true

          # Ensure gradle wrapper + launcher icons exist (wrapper is gitignored)
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || [ ! -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            echo "Generating Android platform files via flutter create..."
            flutter create --platforms=android --project-name govtsahayak --org com.govtsahayak .
          fi

          # Always strip Groovy files that flutter create may have written
          rm -f android/build.gradle android/settings.gradle android/app/build.gradle || true

          # Restore our committed Kotlin DSL (AGP 8.11.1 + Kotlin 2.1.0 + namespace/minSdk)
          # so flutter create cannot leave us on an old AGP
          git checkout -- android/settings.gradle.kts android/app/build.gradle.kts android/build.gradle.kts || true

          # Sanity check
          echo "=== settings.gradle.kts (first 20 lines) ==="
          head -20 android/settings.gradle.kts || true
          echo "=== app/build.gradle.kts namespace check ==="
          grep -E 'namespace|minSdk|applicationId' android/app/build.gradle.kts || true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK release
        run: |
          flutter build apk --release \
            --dart-define=OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: govtsahayak-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
