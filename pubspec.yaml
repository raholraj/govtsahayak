name: govtsahayak
description: GovtSahayak — Har Bharatiya ke jeb mein ek digital cyber-cafe wala. AI chatbot for government services in Hinglish.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.3
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge_base.json
    - assets/images/
